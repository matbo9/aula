name: Aula
on:
  workflow_dispatch:
    inputs:
      corso:
        description: "Nome del file del corso, senza .txt"
        default: "economia_internazionale"
      lezione:
        description: "piano, intro, oppure il numero della lezione (1, 2, 3...)"
        default: "intro"
      argomento:
        description: "Facoltativo: solo per una lezione fuori percorso"
        default: ""
      minuti:
        description: "Facoltativo: durata (10-40). Vuoto = quella del percorso"
        default: ""
permissions:
  contents: write
jobs:
  aula:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa ffmpeg se manca
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: pip install requests matplotlib numpy edge-tts gTTS
      - run: python aula.py
        env:
          CORSO: ${{ inputs.corso }}
          LEZIONE: ${{ inputs.lezione }}
          ARGOMENTO: ${{ inputs.argomento }}
          MINUTI: ${{ inputs.minuti }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AULA_VOCE: ${{ vars.VOCE }}
          AULA_RITMO: ${{ vars.RITMO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Salva il percorso di studio
        run: |
          if [ -n "$(git status --porcelain piani)" ]; then
            git config user.name "aula-bot"
            git config user.email "aula-bot@users.noreply.github.com"
            git add piani
            git commit -m "Percorso di studio"
            git push
          fi
